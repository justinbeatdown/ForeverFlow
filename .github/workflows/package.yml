name: Validate and package ForeverFlow

on:
  push:
    branches: [main, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The tested icons are tracked in Git: never regenerate/recolor them
      # during release packaging, or the archive may differ from the approved RC2.
      - name: Validate addon layout and manifest
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path("ForeverFlow")
          toc = root / "ForeverFlow.toc"
          assert toc.is_file(), "Missing ForeverFlow/ForeverFlow.toc"
          content = toc.read_text(encoding="utf-8")
          assert re.search(r"^## Interface:\s*16001\s*$", content, re.M), "Not targeted at WoW: Forever (16001)"
          version = re.search(r"^## Version:\s*(\S+)\s*$", content, re.M)
          assert version, "Missing addon version"
          for line in content.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              path = root / line.replace("\\", "/")
              assert path.is_file(), f"Missing file referenced in TOC: {line}"
          icon = re.search(r"^## IconTexture:\s*(.+)$", content, re.M)
          assert icon and (root / "Media" / "OfficialCircle.tga").is_file(), "Official brand icon missing"
          for texture in ["OfficialCircle.tga","MinimapRound.tga","BrandSeal.tga","HUDBackground.tga","GuideLogoSmall.tga","MinimapIconRound.tga"]:
              assert (root / "Media" / texture).is_file(), f"Missing texture {texture}"
          print("Validated ForeverFlow", version.group(1), "for interface 16001")

      - name: Validate all Lua syntax and World Quest eligibility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for file in ForeverFlow/*.lua; do luac5.4 -p "$file"; done
          lua5.4 - <<'LUA'
          local FF={questCatalog={}}
          UnitRace=function() return "Orc","Orc",2 end
          UnitClass=function() return "Shaman","SHAMAN",7 end
          IsQuestFlaggedCompleted=function() return false end
          GetTime=function() return 100 end
          C_Map={GetMapInfo=function(id)
            return {name=({[1413]="The Barrens",[1442]="Stonetalon Mountains"})[id] or "Unknown map"}
          end}
          assert(loadfile("ForeverFlow/WorldQuestData.lua"))("ForeverFlow",FF)
          assert(loadfile("ForeverFlow/WorldQuestEngine.lua"))("ForeverFlow",FF)
          local data=FF.worldQuestData
          assert(type(data.start)=="table" and type(data.gates)=="table")
          local count,zones=0,{}
          for _,maps in pairs(data.start) do
            count=count+1
            for zone in pairs(maps) do zones[zone]=true end
          end
          local nzone=0
          for _ in pairs(zones) do nzone=nzone+1 end
          print("Dataset audit: "..count.." quest starts, "..nzone.." map areas")
          assert(count>=4000 and nzone>=40, "World quest database incomplete")
          local localQuests=FF:WorldQuestCandidates({level=17,quests={}},1413,false,{},{})
          assert(#localQuests>0, "Expected Barrens suggestions for level-17 Horde")
          for _,q in ipairs(localQuests) do
            assert(q.mapID==1413, "Local mode should contain local map only")
            assert(type(q.x)=="number" and q.x>=0 and q.x<=100)
          end
          FF._worldQuestCache=nil
          local withQuest=FF:WorldQuestCandidates({level=17,quests={{id=871}}},1413,false,{},{})
          for _,q in ipairs(withQuest) do assert(q.id~=871, "Active quest leaked into discovery") end
          FF._worldQuestCache=nil
          local browsed=FF:WorldQuestCandidates({level=17,quests={}},1442,true,{},{})
          assert(#browsed>0, "World browse should yield suitable quest pickups")
          print("World coverage checked: "..count.." documented quests, "..nzone.." map areas.")
          LUA

      - name: Test cross-race, cross-class and profession guidance
        shell: bash
        run: |
          set -euo pipefail
          lua5.4 - <<'LUA'
          local FF={questCatalog={}}
          local race,class=2,7
          UnitRace=function() return "MockRace","MockRace",race end
          UnitClass=function() return "MockClass","MOCK",class end
          IsQuestFlaggedCompleted=function() return false end
          GetTime=function() return 100 end
          C_Map={GetMapInfo=function(id) return {name="Map "..tostring(id)} end}
          assert(loadfile("ForeverFlow/WorldQuestData.lua"))("ForeverFlow",FF)
          assert(loadfile("ForeverFlow/WorldQuestEngine.lua"))("ForeverFlow",FF)
          assert(loadfile("ForeverFlow/ProfessionCoach.lua"))("ForeverFlow",FF)
          local world=FF.worldQuestData
          -- Smoke test all standard Classic race IDs and all Classic class IDs.
          local classes={1,2,3,4,5,7,8,9,11}
          for raceID=1,8 do
            for _,classID in ipairs(classes) do
              race,class=raceID,classID
              FF._worldQuestCache=nil
              local found=FF:WorldQuestCandidates({level=20,quests={}},1413,true,{},{})
              assert(type(found)=="table" and #found<=220)
              for _,q in ipairs(found) do
                assert(type(q.id)=="number" and type(q.title)=="string")
                assert(q.x>=0 and q.x<=100 and q.y>=0 and q.y<=100)
              end
            end
          end
          -- Isolated gate tests ensure no race/class-restricted quest leaks.
          FF.worldQuestData={
            start={[999999]={[1413]={1123456789}}},
            gates={[999999]=10*1e11+15*1e9+2*1e4+64},
            names={[999999]="Mock restricted quest"},pre={},preAll={},excl={},chain={},
            parent={},skill={},minRep={},maxRep={}
          }
          race,class=2,7
          FF._worldQuestCache=nil
          assert(#FF:WorldQuestCandidates({level=17,quests={}},1413,false,{},{})==1)
          race,class=1,7
          FF._worldQuestCache=nil
          assert(#FF:WorldQuestCandidates({level=17,quests={}},1413,false,{},{})==0)
          race,class=2,1
          FF._worldQuestCache=nil
          assert(#FF:WorldQuestCandidates({level=17,quests={}},1413,false,{},{})==0)
          FF.worldQuestData=world
          local professionNames={"Herbalism","Mining","Skinning","Alchemy",
            "Blacksmithing","Enchanting","Engineering","Leatherworking",
            "Tailoring","Jewelcrafting","Inscription","Cooking","Fishing",
            "First Aid","Archaeology"}
          for _,name in ipairs(professionNames) do
            local p={name=name,skill=74,cap=75}
            local entries=FF:ProfessionCoachEntries({professions={primary={p},secondary={}}})
            assert(#entries==1 and entries[1].step:find("trainer"),"Missing trainer guidance: "..name)
            assert(type(entries[1].action)=="string" and #entries[1].action>20)
          end
          local fallback=FF:ProfessionCoachEntries({professions={primary={{name="Server custom",skill=12,cap=75}},secondary={}}})
          assert(#fallback==1 and fallback[1].action:find("profession"))
          print("Verified 72 classic race/class combinations and 16 profession profiles/fallbacks.")
          LUA

      - name: Build CurseForge-ready ZIP
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          root = Path("ForeverFlow")
          toc = (root / "ForeverFlow.toc").read_text(encoding="utf-8")
          version = re.search(r"^## Version:\s*(\S+)\s*$", toc, re.M).group(1)
          release = __import__("os").environ.get("GITHUB_REF", "") == "refs/heads/release" or __import__("os").environ.get("GITHUB_REF", "").startswith("refs/tags/v")
          out = Path("ForeverFlow_v" + version + ("_Release.zip" if release else "_Beta.zip"))
          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(root.rglob("*")):
                  if file.is_file() and not file.name.startswith("."):
                      archive.write(file, file.as_posix())
          with ZipFile(out) as archive:
              bad = archive.testzip()
              assert bad is None, f"Corrupt archive entry: {bad}"
              assert "ForeverFlow/ForeverFlow.toc" in archive.namelist()
          print(f"Created {out} ({out.stat().st_size:,} bytes)")
          Path("zip_filename.txt").write_text(out.name, encoding="utf-8")

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ForeverFlow-installable
          path: ForeverFlow_v*.zip
          if-no-files-found: error

      # Only updates to the dedicated release branch or version tags publish.
      # Pushes to main and pull requests build/test only.
      - name: Publish approved version to CurseForge
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
        env:
          CF_AUTHOR_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CF_PROJECT_ID: "1793262"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_AUTHOR_TOKEN}" ]]; then
            echo "::error::Add the CURSEFORGE_API_TOKEN repository secret before releasing."
            exit 1
          fi
          VERSION="$(sed -n 's/^## Version: *//p' ForeverFlow/ForeverFlow.toc | tr -d '\r')"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match addon manifest version ${VERSION}."
            exit 1
          fi
          FILE="$(cat zip_filename.txt)"
          python - <<'PY'
          import json
          from pathlib import Path
          version = next(x.split(":",1)[1].strip() for x in Path("ForeverFlow/ForeverFlow.toc").read_text().splitlines() if x.startswith("## Version:"))
          changelog = Path("ForeverFlow/CHANGELOG.txt").read_text(encoding="utf-8")
          metadata = {
              "changelog": changelog,
              "changelogType": "text",
              "displayName": f"ForeverFlow {version}",
              "gameVersionNames": ["1.60.1"],
              "releaseType": "release",
              "isMarkedForManualRelease": False
          }
          Path("curseforge-metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
          PY
          curl --fail-with-body --show-error --silent --retry 2 \
            -H "X-Api-Token: ${CF_AUTHOR_TOKEN}" \
            -F "metadata=<curseforge-metadata.json" \
            -F "file=@${FILE}" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
